name: Qt Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.2'

    - name: Configure
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release
    - name: Upload Build
      uses: actions/upload-artifact@v4
      with:
        name: app
        path: build/
