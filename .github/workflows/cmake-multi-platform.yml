name: Qt Build

on:
  push:
  pull_request:

jobs:
  build:

    runs-on: windows-latest

    steps:

    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.2'

    - name: Configure
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=Release
    - name: Build
      run: cmake --build build --config Release

    - name: Deploy Qt
      run: |
        windeployqt --qmldir . build\Release\appdataSpliter.exe
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: build/Release/
